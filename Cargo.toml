[package]
name = "sap-error-utils"
version = "0.1.1"
edition = "2021"
default-run = "inbox_errors"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.69"
calamine = "0.19.1"
chrono = "0.4.23"
csv = "1.2.0"
eframe = { version = "0.21.3", features = ["persistence"] }
glob = "0.3.1"
lazy_static = "1.4.0"
regex = "1.7.1"
serde = { version = "1.0", features = ["derive"] }
tiberius = { version = "0.12.3", features = [
    "sql-browser-tokio",
    "integrated-auth-gssapi",
] }
tokio-util = { version = "0.7.11", features = ["compat"] }
tokio = { version = "1.38.0", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
] }
serde_json = "1.0.125"
log = "0.4.22"

[[bin]]
name = "inbox_errors"
